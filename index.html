<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Candice</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,500&family=Work+Sans:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#F3F2F7; --surface:#FFFFFF; --surface-2:#EAE7F0;
    --ink:#232136; --muted:#6E6A80; --accent:#8C5383; --accent-ink:#5C3556;
    --line:#DCD8E6;
    --shadow: 0 1px 2px rgba(35,33,54,.06), 0 10px 28px -14px rgba(35,33,54,.22);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#171622; --surface:#1F1E2C; --surface-2:#262536;
      --ink:#EDEBF3; --muted:#A6A2B8; --accent:#C98BBE; --accent-ink:#E5B7DC;
      --line:#333243;
      --shadow: 0 1px 2px rgba(0,0,0,.35), 0 12px 30px -16px rgba(0,0,0,.6);
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Work Sans","PingFang TC","Heiti TC",system-ui,sans-serif;
    line-height:1.7; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:760px;margin:0 auto;padding:44px 20px 72px}
  header{margin-bottom:34px}
  h1{
    font-family:"Newsreader",Georgia,serif; font-weight:500; font-size:40px;
    letter-spacing:.5px; margin:0 0 6px;
  }
  .tag{color:var(--muted);font-size:14px}
  h2{
    font-family:"Newsreader",Georgia,serif; font-weight:500; font-size:23px;
    margin:38px 0 4px; display:flex; align-items:baseline; gap:10px;
  }
  h2 .n{font-size:13px;color:var(--accent);font-family:"Work Sans",sans-serif;letter-spacing:1.5px}
  .lead{color:var(--muted);font-size:14.5px;margin:0 0 16px}
  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:12px;
    padding:18px 20px; margin:12px 0; box-shadow:var(--shadow);
  }
  .card h3{margin:0 0 4px;font-size:17px;font-weight:600}
  .card p{margin:0;color:var(--muted);font-size:14.5px}
  .row{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}
  a.btn{
    display:inline-block; text-decoration:none; font-size:14.5px; font-weight:500;
    padding:9px 16px; border-radius:9px; border:1px solid var(--line);
    background:var(--surface-2); color:var(--ink); transition:.15s;
  }
  a.btn:hover{border-color:var(--accent);color:var(--accent-ink)}
  a.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  a.btn.primary:hover{opacity:.88;color:#fff}
  table{width:100%;border-collapse:collapse;margin-top:8px;font-size:14.5px}
  td{padding:9px 0;border-bottom:1px solid var(--line);vertical-align:top}
  td.ep{width:74px;color:var(--accent);font-weight:600;white-space:nowrap}
  td.len{width:64px;color:var(--muted);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
  tr:last-child td{border-bottom:none}
  .sub{color:var(--muted);font-size:13px;margin-top:3px}
  .feed{
    background:var(--surface-2); border:1px solid var(--line); border-radius:10px;
    padding:13px 16px; margin-top:14px; font-size:13.5px; color:var(--muted);
  }
  .feed code{
    display:block; margin-top:5px; padding:8px 10px; background:var(--surface);
    border:1px solid var(--line); border-radius:7px; font-size:12.5px;
    color:var(--ink); word-break:break-all; font-family:ui-monospace,monospace;
  }
  footer{margin-top:54px;padding-top:20px;border-top:1px solid var(--line);
    color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>Candice</h1>
  <div class="tag">國文教學 · 講義與 podcast</div>
</header>

<h2><span class="n">01</span>先秦諸子與九流十家</h2>
<p class="lead">高中國文／中國文化基本教材。涵蓋韓非、九流十家、諸子典籍、老莊比較、子學流變（漢→清）、先秦文學，以及可獨立成課的諸子寓言單元。</p>

<div class="card">
  <h3>學生版重點整理</h3>
  <p>18 頁。大標題＋小重點＋表格，考前速記用。</p>
  <div class="row">
    <a class="btn primary" href="zhuzi-revision.pdf">下載 PDF</a>
  </div>
</div>



<h2><span class="n">02</span>Podcast</h2>

<footer>
  網站由 GitHub Pages 提供服務，不需要家裡的電腦開機。<br>
  內容更新於 2026-09-25。
</footer>

</div>
</body>
</html>
